function activateTab(id){let t=tabs.find(t=>t.id===id);if(!t)return;current=id;activeView=t.view;renderTabs();renderView();}
function newTab(){if(tabs.length>=maxTabs)return toast('Maximum 12 tabs in this preview.');const t={id:nextId++,title:'New Tab',view:'home',input:''};tabs.push(t);activateTab(t.id)}
function closeTab(id){tabs=tabs.filter(t=>t.id!==id);if(!tabs.length){tabs=[{id:nextId++,title:'New Tab',view:'home',input:''}]}activateTab(tabs.some(t=>t.id===current)?current:tabs.at(-1).id)}
function renderTabs(){const strip=$('horizontal-tabs');strip.replaceChildren();
 for(const t of tabs){const b=document.createElement('button');b.type='button';b.className='tab-button'+(t.id===current?' active':'');b.setAttribute('role','tab');b.setAttribute('aria-selected',String(t.id===current));b.innerHTML='<span class="tab-dot"></span><span class="tab-label"></span><span class="close-tab" aria-label="Close tab">×</span>';b.querySelector('.tab-label').textContent=t.title;b.querySelector('.close-tab').onclick=e=>{e.stopPropagation();closeTab(t.id)};b.onclick=()=>activateTab(t.id);strip.append(b)}
 const vertical=$('vertical-tabs');vertical.replaceChildren();for(const t of tabs){const b=document.createElement('button');b.className='rail-tab'+(t.id===current?' active':'');b.type='button';b.textContent=t.title;b.onclick=()=>activateTab(t.id);vertical.append(b)}
 const address=$('address');address.value=currentTab()?.input||'';
}
function goView(v){const t=currentTab();if(!t)return;t.view=v;t.title={home:'New Tab',arcade:'Arcade',web:'Website',conversations:'Conversations',settings:'Settings'}[v]||'New Tab';activateTab(t.id);}
function clearOverlay(){stopSnake();$('arcade').hidden=true;document.body.classList.remove('arcade-open');$('browser-container').replaceChildren();$('browser-container').style.display='';$('utility-drawer').hidden=true;
 if(isPhone())closeAI();}
function renderView(){clearOverlay();if(activeView==='arcade'){showArcade();return;}if(activeView==='web'){showWebMessage();return;}renderHome();if(activeView==='conversations')openAI();if(activeView==='settings')showSettings();}
function wallpaperSrc(i=wallpaper){return wallpapers[i].src}
function applyWallpaper(i){if(i<0||i>=wallpapers.length)return;wallpaper=i;
 for(const s of document.querySelectorAll('.wallpaper-scene')){s.style.backgroundImage=`url("${wallpaperSrc()}")`;s.style.backgroundSize='cover';s.style.backgroundPosition='center'}
 for(const c of document.querySelectorAll('.wallpaper-caption'))c.textContent=wallpapers[i].name;
 for(const e of document.querySelectorAll('[data-wallpaper]'))e.classList.toggle('selected',Number(e.dataset.wallpaper)===i);
}
function renderHome(){const pane=$('browser-container');pane.innerHTML=`<section class="newtab atelier-home"><div class="wallpaper-scene" aria-hidden="true"></div><div class="home-vignette"></div>
 <div class="atelier-home-content"><div class="home-time"><p class="home-date" id="web-date"></p><div class="home-clock" id="web-clock"></div></div><h1 class="home-greeting" id="web-greeting"></h1>
 <form class="atelier-search" id="web-search-form" role="search">${icon('search')}<input class="home-search" aria-label="Search or enter a website" placeholder="Search or enter a website" autocomplete="off"><kbd>↵</kbd><button type="submit" aria-label="Go">${icon('forward')}</button></form>
 <div class="atelier-shortcuts"><button class="shortcut" data-go="arcade"><span class="shortcut-icon">✦</span><span>Arcade</span></button><button class="shortcut" data-go="conversations"><span class="shortcut-icon">✧</span><span>AI</span></button><button class="shortcut" data-go="settings"><span class="shortcut-icon">◈</span><span>Vibes</span></button><button class="shortcut" data-go="web"><span class="shortcut-icon">↗</span><span>Browse</span></button></div>
 <p class="web-home-hint">Web Edition preview · Desktop design, made for Chromebook</p>
 </div><div class="home-footer"><span class="wallpaper-caption"></span><button type="button" class="customize-home" id="customize-home">${icon('settings')} Customize</button></div></section>`;
 applyWallpaper(wallpaper);updateClock();$('customize-home').onclick=showSettings;
 $('web-search-form').onsubmit=e=>{e.preventDefault();visit(pane.querySelector('.home-search').value)};
 for(const b of pane.querySelectorAll('[data-go]'))b.onclick=()=>goView(b.dataset.go);
}
function updateClock(){const d=new Date();const clock=$('web-clock'),date=$('web-date'),g=$('web-greeting');if(clock)clock.textContent=d.toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});if(date)date.textContent=d.toLocaleDateString([],{weekday:'long',month:'long',day:'numeric'});if(g)g.textContent=d.getHours()<12?'Good morning.':d.getHours()<17?'Good afternoon.':'Good evening.';}
function visit(v){v=(v||'').trim();if(!v)return;let t=currentTab();t.view='web';t.title=v.length>26?v.slice(0,24)+'…':v;t.input=v;activateTab(t.id)}
function showWebMessage(){let text=currentTab()?.input||'';const p=$('browser-container');p.innerHTML=`<div class="browser-page-message"><div class="browser-page-card"><span class="web-chip">WEB EDITION · PREVIEW</span><h2>Browsing is not connected yet.</h2><p>This design uses PoxeyX1's real desktop interface, but it does not secretly send website requests through your Chromebook. A properly encrypted and isolated remote-browser service must be deployed before that privacy promise can be tested.</p><p id="requested-url"></p><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="web-action primary" id="return-home">New Tab</button><button class="web-action" id="open-arcade">Open Arcade</button></div><p class="web-only-note">No destination was contacted. The address bar showing a URL never means the website was loaded.</p></div></div>`;
 p.querySelector('#requested-url').textContent=text?'Requested: '+text:'';p.querySelector('#return-home').onclick=()=>goView('home');p.querySelector('#open-arcade').onclick=()=>goView('arcade');}
function openAI(){$('ai-panel').hidden=false;document.body.classList.add('ai-open');const messages=$('ai-messages');messages.innerHTML='<div class="ai-placeholder"><b>Conversations</b>This is the original desktop AI panel design. Cloud AI is not connected to this local Web Edition preview, so messages are not transmitted or stored.</div>';$('ai-model-label').textContent='Preview only';}
function closeAI(){$('ai-panel').hidden=true;document.body.classList.remove('ai-open','ai-workspace')}
function aiNoop(){toast('Cloud AI is not connected in this preview. Nothing was sent or saved.');$('ai-input').value='';}
function showSettings(){const d=$('utility-drawer');d.hidden=false;$('drawer-eyebrow').textContent='POXEYX1 WEB';$('drawer-title').textContent='Vibes & Appearance';
 $('drawer-content').innerHTML=`<p class="web-drawer-section">Choose from the actual 16 desktop wallpaper files. Changes are temporary and reset when you close this preview.</p><h3 class="web-drawer-title">Wallpaper gallery</h3><div class="web-grid" id="web-wallpapers"></div><h3 class="web-drawer-title">Appearance</h3><div class="game-buttons"><button class="web-action" data-appearance="dark">Dark</button><button class="web-action" data-appearance="light">Light</button></div><p class="web-only-note">Your preview stores no browsing history, bookmarks, messages, or preferences.</p>`;
 const grid=$('web-wallpapers');wallpapers.forEach((w,i)=>{const b=document.createElement('button');b.type='button';b.className='web-card';b.dataset.wallpaper=i;const img=document.createElement('img');img.src=w.src;img.alt='';img.loading='lazy';const title=document.createElement('strong');title.textContent=w.name;b.append(img,title);b.onclick=()=>applyWallpaper(i);grid.append(b)});
 d.querySelectorAll('[data-appearance]').forEach(b=>b.onclick=()=>{document.body.dataset.theme=b.dataset.appearance});applyWallpaper(wallpaper);
}
function showArcade(){closeAI();document.body.classList.add('arcade-open');$('arcade').hidden=false;$('arcade').innerHTML=`<nav class="arcade-nav"><div class="arcade-logo"><span class="arcade-mark">✦</span> Poxey Arcade</div><div class="arcade-nav-label">EXPLORE</div><button class="arcade-nav-item selected" id="arcade-library-btn">Discover</button><button class="arcade-back" id="arcade-back">← Back to browser</button><div class="arcade-nav-foot">Two original mini games in this web preview.\nDesktop collection is not ported.</div></nav>
 <div class="arcade-library"><div class="arcade-library-top"><span class="arcade-eyebrow">YOUR ARCADE · WEB EDITION</span><span class="web-only-tag">2 playable games</span></div>
 <div class="arcade-hero"><div class="arcade-hero-text"><div class="arcade-badge">POXEY ARCADE</div><h1>Play a little.\nStay a while.</h1><p>The desktop-style Arcade, now in your browser.</p><button class="arcade-hero-button" id="featured-play">Play Neon Snake</button></div><div class="arcade-collage"><div style="font-size:150px;opacity:.5;text-align:center;line-height:1.4">✦</div></div></div>
 <div id="arcade-library-area"><h2 style="margin-top:34px">Ready to play</h2><div class="arcade-card-grid"><button class="arcade-game-card" data-play="snake"><span>CLASSIC · ARCADE</span><strong>🐍 Neon Snake</strong><span>Keyboard / touch controls</span></button><button class="arcade-game-card" data-play="2048"><span>PUZZLE · ARCADE</span><strong>◈ 2048</strong><span>Merge tiles and chase a high score</span></button></div><p class="web-only-note">The 21 desktop Arcade titles are not bundled into this static preview.</p></div><div id="game-area" hidden></div></div>`;
 $('arcade-back').onclick=()=>goView('home');$('featured-play').onclick=()=>playGame('snake');$('arcade-library-btn').onclick=()=>{stopSnake();$('game-area').hidden=true;$('arcade-library-area').hidden=false};$('arcade').querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>playGame(b.dataset.play));
}
function stopSnake(){if(snakeTimer)clearInterval(snakeTimer);snakeTimer=null;playing=null}
function playGame(name){stopSnake();playing=name;$('arcade-library-area').hidden=true;const area=$('game-area');area.hidden=false;area.innerHTML=`<div class="game-panel"><h2 id="game-title"></h2><p>Score: <b id="game-score">0</b> · This score isn't saved</p><canvas id="snake-canvas" width="400" height="400"></canvas><div id="tiles-2048" style="display:none;grid-template-columns:repeat(4,1fr);gap:8px;max-width:350px;aspect-ratio:1;margin:0 auto;background:#232537;padding:8px;border-radius:12px"></div><div class="game-buttons"><button class="web-action" id="game-restart">Restart</button><button class="web-action" id="game-exit">All games</button></div><div class="game-pad" id="game-pad"><button class="web-action" data-move="up">↑</button><div><button class="web-action" data-move="left">←</button><button class="web-action" data-move="down">↓</button><button class="web-action" data-move="right">→</button></div></div><p class="web-only-note">Use arrow keys / WASD, or touch arrows.</p></div>`;
 $('game-title').textContent=name==='snake'?'Neon Snake':'2048';$('snake-canvas').style.display=name==='snake'?'block':'none';$('tiles-2048').style.display=name==='snake'?'none':'grid';
 $('game-restart').onclick=()=>playGame(name);$('game-exit').onclick=()=>{$('game-area').hidden=true;$('arcade-library-area').hidden=false;stopSnake()};area.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>move(b.dataset.move));
 if(name==='snake')resetSnake();else reset2048();
}
function setScore(n){score=n;if($('game-score'))$('game-score').textContent=score}
const canvas=()=> $('snake-canvas');
function drawSnake(){const c=canvas();if(!c)return;const ctx=c.getContext('2d');ctx.fillStyle='#141b2e';ctx.fillRect(0,0,400,400);ctx.strokeStyle='#243045';ctx.lineWidth=.5;for(let i=0;i<21;i++){ctx.beginPath();ctx.moveTo(i*20,0);ctx.lineTo(i*20,400);ctx.moveTo(0,i*20);ctx.lineTo(400,i*20);ctx.stroke()};ctx.fillStyle='#fb9da9';ctx.beginPath();ctx.arc(food.x*20+10,food.y*20+10,6,0,2*Math.PI);ctx.fill();snake.forEach((p,i)=>{ctx.fillStyle=i?'#8bdbbb':'#d6ffe5';ctx.fillRect(p.x*20+1,p.y*20+1,18,18)});}
function spawnFood(){const free=[];for(let x=0;x<20;x++)for(let y=0;y<20;y++)if(!snake.some(p=>p.x===x&&p.y===y))free.push({x,y});food=free[Math.floor(Math.random()*free.length)]||food}
function resetSnake(){snake=[{x:7,y:9},{x:6,y:9},{x:5,y:9}];dir={x:1,y:0};pending={x:1,y:0};setScore(0);spawnFood();drawSnake();snakeTimer=setInterval(()=>{if(playing!=='snake')return;dir=pending;const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};const eat=head.x===food.x&&head.y===food.y;const collision=(eat?snake:snake.slice(0,-1)).some(p=>p.x===head.x&&p.y===head.y);if(head.x<0||head.y<0||head.x>=20||head.y>=20||collision){stopSnake();toast('Game over! Press Restart to play again.');return}snake.unshift(head);if(eat){setScore(score+10);spawnFood()}else snake.pop();drawSnake()},150)}
function newTile(){const empty=[];for(let y=0;y<4;y++)for(let x=0;x<4;x++)if(!board[y][x])empty.push([y,x]);if(empty.length){const[y,x]=empty[Math.floor(Math.random()*empty.length)];board[y][x]=Math.random()<.9?2:4}}
function reset2048(){board=Array.from({length:4},()=>[0,0,0,0]);setScore(0);newTile();newTile();draw2048()}
function draw2048(){const e=$('tiles-2048');if(!e)return;e.replaceChildren();board.flat().forEach(n=>{const t=document.createElement('div');t.style.cssText=`display:grid;place-items:center;border-radius:8px;background:${n?'#65609a':'#34364c'};font-size:${n>512?'19':'29'}px;font-weight:750;color:#fff`;t.textContent=n||'';e.append(t)})}
function pack(row){const a=row.filter(Boolean),b=[];for(let i=0;i<a.length;i++){if(a[i]===a[i+1]){const v=a[i]*2;b.push(v);setScore(score+v);i++}else b.push(a[i])}while(b.length<4)b.push(0);return b}
function move(d){if(playing==='snake'){const v={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[d];if(!v)return;if(v[0]!==-dir.x||v[1]!==-dir.y)pending={x:v[0],y:v[1]};return}if(playing!=='2048')return;const old=JSON.stringify(board);if(d==='left'||d==='right'){board=board.map(r=>{let c=d==='right'?r.slice().reverse():r.slice();c=pack(c);return d==='right'?c.reverse():c})}else{for(let x=0;x<4;x++){let c=board.map(r=>r[x]);if(d==='down')c.reverse();c=pack(c);if(d==='down')c.reverse();for(let y=0;y<4;y++)board[y][x]=c[y]}}if(JSON.stringify(board)!==old)newTile();draw2048()}
// Actual desktop shell controls
$('top-new-tab').onclick=newTab;$('side-new-tab').onclick=newTab;
$('nav-back').onclick=()=>goView('home');$('nav-forward').onclick=()=>toast('No remote browser is connected.');$('nav-reload').onclick=renderView;
$('btn-arcade').onclick=()=>goView('arcade');$('btn-ai').onclick=()=>{$('ai-panel').hidden?openAI():closeAI()};$('top-open-workspace').onclick=()=>goView('conversations');$('rail-open-workspace').onclick=()=>goView('conversations');
$('btn-settings').onclick=showSettings;$('drawer-close').onclick=()=>$('utility-drawer').hidden=true;
$('ai-close').onclick=closeAI;$('ai-expand').onclick=()=>{document.body.classList.toggle('ai-workspace');openAI()};$('ai-send').onclick=aiNoop;
$('ai-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();aiNoop()}});
$('ai-history').onclick=()=>toast('Chat history is not stored in this private preview.');$('ai-attach-file').onclick=aiNoop;$('ai-mic').onclick=aiNoop;
$('ai-agent-mode').onclick=()=>toast('Agent mode is not connected in this preview.');$('ai-model-label').onclick=()=>toast('Model selection requires a secure backend.');
$('btn-bookmark').onclick=()=>toast('No bookmarks are saved in this private preview.');$('btn-history').onclick=()=>toast('Browsing history is not stored.');$('btn-downloads').onclick=()=>toast('No download history is stored.');
$('address').addEventListener('keydown',e=>{if(e.key==='Enter')visit(e.currentTarget.value)});
$('quick-popover-close').onclick=()=>$('quick-popover').hidden=true;
window.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key==='t'){e.preventDefault();newTab()}if((e.ctrlKey||e.metaKey)&&e.key==='l'){e.preventDefault();$('address').focus();$('address').select()}if(playing && !['INPUT','TEXTAREA'].includes(document.activeElement?.tagName)){const d={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',w:'up',a:'left',s:'down',d:'right'}[e.key];if(d){e.preventDefault();move(d)}}});
$('onboarding').hidden=true;
$('status-left').innerHTML='<span class="status-dot"></span> Web Edition · UI preview';
$('status-right').hidden=false;$('status-right').textContent='Private session · No sync';
closeAI();activateTab(1);setInterval(updateClock,30000);

</script>
