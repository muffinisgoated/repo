  <div id="app" class="app-shell">
    <header class="chrome-head">
      <div class="chrome-topline">
        <div class="brand" title="PoxeyX1"><img class="brand-logo" src="assets/logo-icon.png" alt="PoxeyX1 logo"></div>
        <div class="tabstrip" id="horizontal-tabs" role="tablist" aria-label="Open tabs"></div>
        <button class="tab-overflow-trigger desktop-overflow" id="tab-overflow-trigger" type="button" aria-label="More open tabs" aria-expanded="false" title="More tabs" hidden>+0 <svg><use href="#i-chevron"/></svg></button>
        <div class="tab-overflow-menu" id="tab-overflow-menu" role="menu" aria-label="Other open tabs" hidden></div>
        <button class="icon-btn add-tab desktop-add" id="top-new-tab" title="New tab (⌘/Ctrl+T)" aria-label="New tab"><svg><use href="#i-plus"/></svg></button>
        
      </div>
      <div class="chrome-navbar">
        <div class="nav-arrows">
          <button class="icon-btn" id="nav-back" aria-label="Back" title="Back"><svg><use href="#i-back"/></svg></button>
          <button class="icon-btn" id="nav-forward" aria-label="Forward" title="Forward"><svg><use href="#i-forward"/></svg></button>
          <button class="icon-btn" id="nav-reload" aria-label="Reload" title="Reload"><svg><use href="#i-reload"/></svg></button>
        </div>
        <button class="top-text-button arcade-entry" id="btn-arcade" aria-label="Games" title="Games"><svg class="gamepad-glyph" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10c2 0 3 2 3.5 4l1 6c.4 3-2 4-4 1l-1-2h-9l-1 2c-2 3-4.4 2-4-1l1-6C4 9 5 7 7 7Z"/><path d="M7 10v5m-2.5-2.5h5"/><circle cx="16" cy="11" r=".7"/><circle cx="18.5" cy="13.5" r=".7"/></svg><span>Games</span></button>
        <div class="omnibox"><svg><use href="#i-search"/></svg><input id="address" type="text" spellcheck="false" autocomplete="off" placeholder="Search the web or enter an address" aria-label="Address and search"><kbd>⌘ L</kbd></div>
        <div class="nav-actions">
          <button class="ai-install-indicator" id="ai-install-indicator" type="button" hidden aria-live="polite" title="AI setup progress"></button>
          <button class="icon-btn" id="btn-bookmark" aria-label="Bookmark this page" title="Bookmark"><svg><use href="#i-bookmark"/></svg></button>
          <button class="icon-btn" id="btn-history" aria-label="History" title="History"><svg><use href="#i-clock"/></svg></button>
          <button class="icon-btn" id="btn-library" aria-label="Bookmarks and history" title="Bookmarks and history"><svg><use href="#i-book"/></svg></button><span class="nav-divider"></span>
          <button class="pill-ai" id="btn-ai" aria-label="Toggle Conversations sidebar"><svg><use href="#i-sparkle"/></svg><span>Conversations</span></button>
          <button class="icon-btn" id="btn-settings" aria-label="Settings" title="Settings"><svg><use href="#i-settings"/></svg></button>
        </div>
      </div>
    </header>

    <aside id="quick-popover" class="quick-popover" hidden aria-label="Browser tools"><header><strong id="quick-popover-title"></strong><button type="button" id="quick-popover-close" aria-label="Close popup">×</button></header><div id="quick-popover-body" class="quick-popover-body"></div></aside>
    <div class="app-main">
      <aside class="vertical-rail" aria-label="Tabs sidebar"><div class="rail-head"><span>TABS</span><button class="icon-btn" id="side-new-tab" title="New tab" aria-label="New tab"><svg><use href="#i-plus"/></svg></button></div><div id="vertical-tabs" class="vertical-tabs" role="tablist"></div><div class="rail-footer"><button class="rail-action" id="rail-open-workspace"><svg><use href="#i-sparkle"/></svg>AI Workspace</button></div></aside>
      <main class="main-stage">
        <section class="browser-stage" id="browser-container" aria-label="Web browser"></section>
        <section id="arcade" class="arcade" aria-label="Poxey Arcade" hidden></section>
        <aside class="drawer" id="utility-drawer" hidden><div class="drawer-head"><div><div class="eyebrow" id="drawer-eyebrow">BROWSER</div><h2 id="drawer-title">Settings</h2></div><button class="icon-btn" id="drawer-close" aria-label="Close panel"><svg><use href="#i-x"/></svg></button></div><div class="drawer-content" id="drawer-content"></div></aside>
        <section id="ai-panel" class="ai-panel" aria-label="AI assistant" hidden>
          <div class="ai-resize-handle" id="ai-resize" title="Drag to resize AI panel"></div>
          <div class="ai-panel-header"><div class="ai-identity"><div class="ai-glyph"><svg><use href="#i-sparkle"/></svg></div><div><div class="ai-name">AI Assistant</div></div></div><div class="ai-header-actions"><button class="icon-btn" id="ai-history" aria-label="AI conversations" title="Conversations"><svg><use href="#i-clock"/></svg></button><button class="icon-btn" id="ai-expand" aria-label="Expand AI workspace" title="Expand / collapse"><svg><use href="#i-panel"/></svg></button><button class="icon-btn" id="ai-close" aria-label="Close AI"><svg><use href="#i-x"/></svg></button></div></div>
          <div class="ai-mode-row"><button id="ai-reader-mode" class="small-pill active-pill" type="button"><svg><use href="#i-message"/></svg>Chat</button><button id="ai-agent-mode" class="small-pill muted-pill" type="button"><svg><use href="#i-sparkle"/></svg>Agent</button><button type="button" class="ai-model-status" id="ai-model-label" title="Choose an AI model">Lite AI</button></div>
          <div id="ai-setup-hint" class="ai-setup-hint" hidden role="status"></div>
          <div id="ai-agent-activity" class="ai-agent-activity" hidden><div class="activity-heading"><span>AGENT ACTIVITY</span><div><button id="agent-pause" type="button">Pause</button><button id="agent-stop" type="button">Stop</button></div></div><div id="agent-steps" class="agent-steps"></div></div><div id="ai-chats" class="ai-chats-drawer" hidden><div class="chat-list-head"><span>YOUR CONVERSATIONS</span><button class="icon-btn" id="chat-new" title="New conversation"><svg><use href="#i-plus"/></svg></button></div><div id="ai-chat-list"></div></div>
          <div class="ai-content"><div id="ai-messages" class="ai-messages"></div><div class="ai-composer-section"><div class="ai-page-status" id="ai-page-status" role="status" hidden></div><div class="composer-box"><textarea id="ai-input" rows="2" maxlength="5000" placeholder="Ask anything about this page or the web…" aria-label="AI message"></textarea><button id="ai-send" aria-label="Send AI message" title="Send message"><svg><use href="#i-send"/></svg></button></div><div class="composer-extras"><button id="ai-attach-file" class="extra-link" title="Attach a text document">+ Attach file</button><button id="ai-mic" class="extra-link" title="Voice input">Voice input</button><button id="ai-clear-attachment" class="extra-link" hidden>Remove file</button></div><div class="composer-foot">AI may make mistakes. Verify important details.</div></div></div>
        </section>
      </main>
    </div>

    <div class="status-bar"><span id="status-left"><span class="status-dot"></span>Ready</span><span id="status-right" hidden></span></div>
  </div>

  <div class="onboarding-backdrop" id="onboarding" hidden role="dialog" aria-modal="true" aria-labelledby="setup-heading">
    <div class="onboarding-card">
      <div class="onboarding-top"><div class="brand onboarding-brand"><img class="brand-logo" src="assets/logo-icon.png" alt="PoxeyX1 logo"><span class="brand-word">Poxey</span></div><span class="setup-meta" id="setup-meta">STEP 1 OF 5</span></div>
      <div class="setup-progress" id="setup-progress"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="setup-content" id="setup-content"></div>
      <div class="setup-bottom"><span>Make it yours. You can change everything later.</span><div><button class="btn-outline" id="setup-back">Back</button><button class="btn-solid" id="setup-next">Continue <svg><use href="#i-forward"/></svg></button></div></div>
    </div>
  </div>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>
